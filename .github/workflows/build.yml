name: Build LocalSend Old APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout LocalSend v1.15.4
        shell: bash
        run: |
          set -euxo pipefail
          git clone \
            --depth 1 \
            --recurse-submodules \
            --branch v1.15.4 \
            https://github.com/localsend/localsend.git \
            source

      - name: Verify project files
        shell: bash
        run: |
          set -euxo pipefail
          test -f source/app/pubspec.yaml
          test -f source/app/android/app/build.gradle
          test -f source/app/android/app/src/main/AndroidManifest.xml
          echo "Project files found."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Verify Flutter
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          dart --version

      - name: Configure LocalSend Old
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          gradle = Path("source/app/android/app/build.gradle")
          content = gradle.read_text(encoding="utf-8")

          content, count = re.subn(
              r'applicationId\s+["\']org\.localsend\.localsend_app["\']',
              'applicationId "org.localsend.localsend_old"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Expected applicationId was not found "
                  "in app/android/app/build.gradle"
              )

          content, count = re.subn(
              r'^[ \t]*applicationIdSuffix\s+["\']\.debug["\'][ \t]*\n?',
              '',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Expected debug applicationIdSuffix was not found"
              )

          gradle.write_text(content, encoding="utf-8")

          manifest = Path(
              "source/app/android/app/src/main/AndroidManifest.xml"
          )
          content = manifest.read_text(encoding="utf-8")

          content, count = re.subn(
              r'android:label=["\']LocalSend["\']',
              'android:label="LocalSend Old"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Expected LocalSend label was not found "
                  "in AndroidManifest.xml"
              )

          manifest.write_text(content, encoding="utf-8")

          print("Configured package ID: org.localsend.localsend_old")
          print("Configured app label: LocalSend Old")
          PYTHON

      - name: Fetch Flutter dependencies
        working-directory: source/app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Build debug APK
        working-directory: source/app
        shell: bash
        run: |
          set -euxo pipefail
          flutter build apk --debug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="source/app/build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK is missing or empty."
            find source/app/build -type f -name "*.apk" -print || true
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-Old-v1.15.4-Android
          path: source/app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

